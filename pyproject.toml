[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencof"
version = "0.1.0"
description = "OpenCoF: Learning to Reason Through Video Generation"
readme = "README.md"
authors = [{name = "OpenCoF Authors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "transformers",
    "imageio",
    "imageio[ffmpeg]",
    "safetensors",
    "einops",
    "sentencepiece",
    "protobuf",
    "modelscope",
    "ftfy",
    "pandas",
    "accelerate",
    "peft",
    "datasets",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://opencof.github.io/"
Repository = "https://github.com/xinyan-cxy/OpenCoF"

[tool.setuptools.packages.find]
include = ["diffsynth*"]

[tool.setuptools]
include-package-data = true
